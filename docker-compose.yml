services:
  open-interest-service:
    build: .
    ports:
      - "9123:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/open_interest.db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
